<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Survival French Bruxelles</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'DM Sans',sans-serif;background:#f7f6f2;color:#1a1a1a;line-height:1.5;display:flex;flex-direction:column;min-height:100vh}

/* HERO */
.hero{background:#1a3a2a;color:#fff;padding:2.5rem 1.5rem 2rem;text-align:center}
.hero h1{font-size:1.8rem;font-weight:700;letter-spacing:-0.4px;margin-bottom:0.4rem}
.hero p{color:rgba(255,255,255,0.78);font-size:0.9rem;max-width:480px;margin:0 auto}

/* MAIN */
main{flex:1;padding:1.8rem 1rem 1.5rem;max-width:520px;margin:0 auto;width:100%}

/* BUTTONS */
.btn-link{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid #e5e5e0;border-radius:10px;padding:1rem 1.25rem;margin-bottom:0.7rem;text-decoration:none;color:#1a3a2a;font-size:0.95rem;font-weight:500;transition:all 0.15s ease}
.btn-link:hover{border-color:#1a3a2a;background:#f9fbf9;transform:translateX(2px)}
.btn-link .arrow{color:#4a9060;font-size:1.1rem;font-weight:400}

/* FOOTER */
footer{padding:1.4rem 1rem 1.2rem;text-align:right;max-width:520px;margin:0 auto;width:100%}
footer .by{font-size:0.74rem;color:#aaa;font-weight:500}
footer .by a{color:#aaa;text-decoration:none;border-bottom:1px dotted #ccc}
footer .by a:hover{color:#1a3a2a;border-bottom-color:#1a3a2a}
</style>
</head>
<body>

<div class="hero">
  <h1>Survival French Bruxelles</h1>

</div>

<main>
  <a class="btn-link" href="https://bespoke-lolly-e1a992.netlify.app/" target="_blank" rel="noopener">

    <span class="arrow">↗</span>
  </a>

  <a class="btn-link" href="https://lucent-chimera-217f3d.netlify.app" target="_blank" rel="noopener">
    <span>🏛️ Migration Museum Guide</span>
    <span class="arrow">↗</span>
  </a>

  <a class="btn-link" href="https://astonishing-stroopwafel-c7149f.netlify.app/" target="_blank" rel="noopener">

  <a class="btn-link" href="https://hilarious-sfogliatella-515863.netlify.app/" target="_blank" rel="noopener">
    <span>🎯 Quiz Bruxelles</span>
    <span class="arrow">↗</span>
  </a>

  <a class="btn-link" href="https://lostinthesubway.netlify.app/" target="_blank" rel="noopener">

    <span class="arrow">↗</span>
  </a>

<footer>
  <div class="by">by <a href="https://idylangue.com" target="_blank" rel="noopener">Idylangue</a></div>
</footer>

</html>
